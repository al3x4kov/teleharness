<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="930" viewBox="0 0 1400 930" font-family="Segoe UI, Inter, Arial, sans-serif">
  
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d1017"/><stop offset="1" stop-color="#111520"/></linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.45"/></filter>
    <marker id="aG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3ecf8e"/></marker>
    <marker id="aB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4f8cff"/></marker>
    <marker id="aO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e07a52"/></marker>
    <marker id="aT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b8ff8"/></marker>
    <style>
      .t { fill:#e6e8ee; } .m { fill:#9aa3b2; } .d { fill:#6b7385; }
      .mono { font-family: Cascadia Code, Consolas, DejaVu Sans Mono, monospace; }
      .box { fill:#161a24; stroke:#2b3242; stroke-width:1.2; }
      .chip { fill:#1e2432; stroke:#323a4d; stroke-width:1; }
    </style>
  </defs>
  <rect width="1400" height="930" fill="url(#bg)"/>
  <text x="60" y="62" font-size="30" font-weight="700" class="t">Teleharness — full-text chat search pipeline (2.5.4)</text>
  <text x="60" y="98" font-size="15" class="m">SQLite FTS5 trigram · fully derived index · tenant isolation · snippet with a deep-link jump into the chat</text>
  <text x="1210" y="62" font-size="12" class="d" text-anchor="end">verified against 2.5.4 code</text>
  <rect x="60" y="170" width="300" height="390" rx="12" class="box"/>
  <circle cx="86" cy="200" r="6" fill="#3ecf8e"/>
  <text x="102" y="205" font-size="14" font-weight="700" class="t">1 · Ingest</text>
  <text x="80" y="252" font-size="12.5" class="t">Every new turn in a chat</text>
  <text x="80" y="290" font-size="12.5" class="t">question → <tspan class='mono'>typedText</tspan></text>
  <rect x="78" y="312" width="264" height="25" rx="7" class="chip"/>
  <text x="90" y="332" font-size="11.5" class="m">strips [obsidian-cache] and directives</text>
  <text x="80" y="363" font-size="12.5" class="t">answer → final text parts</text>
  <rect x="78" y="385" width="264" height="25" rx="7" class="chip"/>
  <text x="90" y="405" font-size="11.5" class="m">no tool / reasoning / synthetic parts</text>
  <rect x="400" y="170" width="300" height="390" rx="12" class="box"/>
  <circle cx="426" cy="200" r="6" fill="#4f8cff"/>
  <text x="442" y="205" font-size="14" font-weight="700" class="t">2 · Derived index</text>
  <text x="420" y="252" font-size="12.5" class="t"><tspan class='mono'>SQLite FTS5</tspan> · trigram</text>
  <rect x="418" y="274" width="264" height="41" rx="7" class="chip"/>
  <text x="430" y="294" font-size="11.5" class="m">chat-search.sqlite · WAL · :memory: in</text>
  <text x="430" y="310" font-size="11.5" class="m">demo</text>
  <rect x="418" y="325" width="264" height="41" rx="7" class="chip"/>
  <text x="430" y="345" font-size="11.5" class="m">fully derived — deleting the db file</text>
  <text x="430" y="361" font-size="11.5" class="m">rebuilds it</text>
  <text x="420" y="392" font-size="12.5" class="m"><tspan class='mono'>onTurnDone / onTurnStart</tspan> — sync</text>
  <text x="420" y="411" font-size="12.5" class="m"><tspan class='mono'>markDirty</tspan> — prompt / undo / revert</text>
  <text x="420" y="430" font-size="12.5" class="m"><tspan class='mono'>forget</tspan> — chat deleted</text>
  <rect x="418" y="452" width="264" height="57" rx="7" class="chip"/>
  <text x="426" y="472" font-size="11.5" class="m">first pass in background:</text>
  <text x="426" y="488" font-size="10.2" class="m"><tspan class='mono'>TELEHARNESS_SEARCH_INDEX_DELAY_MS</tspan> (10 s)</text>
  <text x="426" y="504" font-size="10.2" class="m"><tspan class='mono'>TELEHARNESS_SEARCH_NO_BG=1</tspan> — off</text>
  <rect x="740" y="170" width="300" height="390" rx="12" class="box"/>
  <circle cx="766" cy="200" r="6" fill="#e07a52"/>
  <text x="782" y="205" font-size="14" font-weight="700" class="t">3 · Query API</text>
  <text x="760" y="252" font-size="12.5" class="t"><tspan class='mono'>GET /teleharness/api/</tspan></text>
  <text x="760" y="271" font-size="12.5" class="t"><tspan class='mono'>session/search?q=…&amp;limit=40</tspan></text>
  <text x="760" y="309" font-size="12.5" class="t">tenant isolation:</text>
  <rect x="758" y="331" width="264" height="41" rx="7" class="chip"/>
  <text x="770" y="351" font-size="11.5" class="m">admin → all chats · tenant → allowedIds</text>
  <text x="770" y="367" font-size="11.5" class="m">only</text>
  <rect x="758" y="382" width="264" height="41" rx="7" class="chip"/>
  <text x="770" y="402" font-size="11.5" class="m">API failure → degrade to title-only</text>
  <text x="770" y="418" font-size="11.5" class="m">search</text>
  <rect x="758" y="433" width="264" height="25" rx="7" class="chip"/>
  <text x="770" y="453" font-size="11.5" class="m">ensureFresh before answering</text>
  <rect x="1080" y="170" width="260" height="390" rx="12" class="box"/>
  <circle cx="1106" cy="200" r="6" fill="#8b8ff8"/>
  <text x="1122" y="205" font-size="14" font-weight="700" class="t">4 · Snippet &amp; jump</text>
  <text x="1100" y="252" font-size="12.5" class="m">snippet with roles</text>
  <text x="1100" y="271" font-size="12.5" class="m">«You / Answer», query in</text>
  <text x="1100" y="290" font-size="12.5" class="m">&lt;mark&gt;, «matches: N»</text>
  <text x="1100" y="328" font-size="12.5" class="t"><tspan class='mono'>#/chat/:id?mid=…</tspan></text>
  <text x="1100" y="347" font-size="12.5" class="t">deep-link</text>
  <rect x="1098" y="369" width="224" height="57" rx="7" class="chip"/>
  <text x="1110" y="389" font-size="11.5" class="m">history auto-load (up to 20</text>
  <text x="1110" y="405" font-size="11.5" class="m">pages) → scroll → .is-search-hit</text>
  <text x="1110" y="421" font-size="11.5" class="m">~3.2 s</text>
  <line x1="368" y1="365" x2="392" y2="365" stroke="#3ecf8e" stroke-width="2" marker-end="url(#aG)"/>
  <line x1="708" y1="365" x2="732" y2="365" stroke="#4f8cff" stroke-width="2" marker-end="url(#aB)"/>
  <line x1="1048" y1="365" x2="1072" y2="365" stroke="#e07a52" stroke-width="2" marker-end="url(#aO)"/>
  <path d="M 1210 560 L 1210 600 L 1030 600 L 1030 614" fill="none" stroke="#8b8ff8" stroke-width="2" marker-end="url(#aT)"/>
  <rect x="60" y="620" width="620" height="230" rx="12" class="box"/>
  <circle cx="86" cy="650" r="6" fill="#3ecf8e"/>
  <text x="102" y="655" font-size="14" font-weight="700" class="t">HomeView · live search</text>
  <rect x="80" y="686" width="224" height="34" rx="8" class="chip"/>
  <text x="192" y="708" text-anchor="middle" font-size="11.5" class="m">debounce 160 ms · AbortController</text>
  <rect x="316" y="686" width="178" height="34" rx="8" class="chip"/>
  <text x="405" y="708" text-anchor="middle" font-size="11.5" class="m">indexing status poll 1.5 s</text>
  <rect x="506" y="686" width="148" height="34" rx="8" class="chip"/>
  <text x="580" y="708" text-anchor="middle" font-size="11.5" class="m">roles «You / Answer»</text>
  <rect x="80" y="732" width="158" height="34" rx="8" class="chip"/>
  <text x="159" y="754" text-anchor="middle" font-size="11.5" class="m">query highlight &lt;mark&gt;</text>
  <rect x="250" y="732" width="142" height="34" rx="8" class="chip"/>
  <text x="321" y="754" text-anchor="middle" font-size="11.5" class="m">«matches: N» counter</text>
  <rect x="404" y="732" width="158" height="34" rx="8" class="chip"/>
  <text x="483" y="754" text-anchor="middle" font-size="11.5" class="m">degraded → title-only</text>
  <rect x="720" y="620" width="620" height="230" rx="12" class="box"/>
  <circle cx="746" cy="650" r="6" fill="#8b8ff8"/>
  <text x="762" y="655" font-size="14" font-weight="700" class="t">ChatView · deep-link jump</text>
  <rect x="740" y="686" width="182" height="34" rx="8" class="chip"/>
  <text x="831" y="708" text-anchor="middle" font-size="11.5" class="m">targetMid from route.query</text>
  <rect x="934" y="686" width="172" height="34" rx="8" class="chip"/>
  <text x="1020" y="708" text-anchor="middle" font-size="11.5" class="m">auto-load up to 20 pages</text>
  <rect x="1118" y="686" width="152" height="34" rx="8" class="chip"/>
  <text x="1194" y="708" text-anchor="middle" font-size="11.5" class="m">scroll to the message</text>
  <rect x="740" y="732" width="138" height="34" rx="8" class="chip"/>
  <text x="809" y="754" text-anchor="middle" font-size="11.5" class="m">.is-search-hit ~3.2 s</text>
  <rect x="890" y="732" width="238" height="34" rx="8" class="chip"/>
  <text x="1009" y="754" text-anchor="middle" font-size="11.5" class="m">search inside merged turns (mergedIds)</text>
  <text x="60" y="895" font-size="12" class="d">Teleharness 2.5.4 · chat-search.js / server.js / routes/session.js / HomeView / MessageList</text>
  </svg>
