name: CI

on:
  push:
    branches: [main, "release-*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Windows runners expose TEMP as an 8.3 short path (C:\Users\RUNNER~1\...);
      # the portal rejects "~" in folder paths, so point temp to a long path.
      - name: Use a long temp path on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "TEMP=${{ runner.temp }}" >> "$GITHUB_ENV"
          echo "TMP=${{ runner.temp }}" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run build
      - run: npm test

  docker:
    name: docker (demo smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t teleharness:ci .
      - name: Smoke-test demo container
        run: |
          docker run -d --name teleharness-ci -p 4180:4180 teleharness:ci
          trap "docker logs teleharness-ci || true; docker rm -f teleharness-ci || true" EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4180/teleharness/api/healthz | grep -q '"ok":true'; then
              echo "Docker demo healthz OK"
              exit 0
            fi
            sleep 1
          done
          echo "Docker demo did not become healthy"
          exit 1
