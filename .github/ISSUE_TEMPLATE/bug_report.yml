name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you got instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start with `npm run demo`
        2. Open ...
        3. ...
  - type: dropdown
    id: engine
    attributes:
      label: Engine
      options:
        - opencode (GLM)
        - claude CLI
        - demo / mock mode
        - not engine-specific
  - type: input
    id: version
    attributes:
      label: zai version
      description: Settings → About, or `version` in package.json
      placeholder: "1.15.1"
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "macOS 15, Node 22.11, Safari on iPhone"
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Server output, browser console. Remove tokens and personal data first.
      render: text
